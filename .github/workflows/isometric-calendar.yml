name: Update contribution activity

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the isometric calendar
        run: >-
          python3 scripts/generate_isometric_calendar.py
          --username "${{ github.repository_owner }}"
          --output assets/isometric-contributions.svg

      - name: Commit an updated calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/isometric-contributions.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/isometric-contributions.svg
          git commit -m "chore: update contribution activity"
          git push
